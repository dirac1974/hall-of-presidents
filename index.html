<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#f5e6c8" />
  <title>Hall of Presidents — Memory Palace</title>
  <style>
    :root {
      --bg: #f8f1e3;
      --wood: #c9a26b;
      --wood-dark: #8b5e3c;
      --glow: #ffd700;
      --soft: #fff8ee;
      --text: #3d2b1f;
      --accent: #e8a87c;
      --success: #7ec8a3;
      --frame-dim: #d4c4a8;
      --frame-glow: #f0c14e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: linear-gradient(180deg, #fdf6e9 0%, #f0e0c0 100%);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    .screen { display: none; min-height: 100vh; padding: 12px; padding-bottom: 90px; }
    .screen.active { display: block; }

    /* Header */
    header {
      text-align: center;
      padding: 12px 8px 8px;
      position: relative;
    }
    header h1 {
      font-size: 1.6rem;
      color: var(--wood-dark);
      text-shadow: 1px 1px 0 #fff;
      letter-spacing: 0.5px;
    }
    header .subtitle {
      font-size: 0.85rem;
      color: #8b7355;
      margin-top: 2px;
    }
    .mission {
      background: var(--soft);
      border: 2px solid var(--wood);
      border-radius: 16px;
      padding: 10px 14px;
      margin: 10px auto;
      max-width: 420px;
      text-align: center;
      font-size: 0.95rem;
      box-shadow: 0 3px 0 var(--wood-dark);
    }
    .mission strong { color: var(--wood-dark); }

    /* Progress pips */
    .pips {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin: 10px 0;
      flex-wrap: wrap;
    }
    .pip {
      width: 18px; height: 18px;
      border-radius: 50%;
      background: #e0d0b0;
      border: 2px solid #c9a26b;
      transition: all 0.3s;
    }
    .pip.filled {
      background: linear-gradient(135deg, #ffd700, #ffaa00);
      box-shadow: 0 0 8px #ffd700aa;
      transform: scale(1.1);
    }

    /* Hall / Timeline */
    .hall {
      display: flex;
      flex-wrap: nowrap;
      overflow-x: auto;
      gap: 14px;
      padding: 16px 12px 24px;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
    }
    .portrait {
      flex: 0 0 130px;
      scroll-snap-align: start;
      background: var(--soft);
      border-radius: 14px;
      border: 4px solid var(--frame-dim);
      padding: 8px 6px 10px;
      text-align: center;
      transition: all 0.4s ease;
      position: relative;
      box-shadow: 0 4px 0 #b8956a;
    }
    .portrait.state-0 { opacity: 0.7; filter: grayscale(0.4); }
    .portrait.state-1 { border-color: #e8b86d; box-shadow: 0 0 10px #e8b86d66, 0 4px 0 #b8956a; }
    .portrait.state-2 { border-color: #f0c14e; box-shadow: 0 0 14px #f0c14e88, 0 4px 0 #b8956a; }
    .portrait.state-3 {
      border-color: #ffd700;
      box-shadow: 0 0 20px #ffd700aa, 0 4px 0 #b8956a;
      background: linear-gradient(180deg, #fff9e6, #fff);
    }
    .portrait .num {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--wood-dark);
      line-height: 1;
    }
    .portrait .name {
      font-size: 0.72rem;
      font-weight: 600;
      margin-top: 4px;
      line-height: 1.15;
      min-height: 2.3em;
    }
    .portrait .status {
      font-size: 0.65rem;
      margin-top: 4px;
      padding: 2px 6px;
      border-radius: 10px;
      display: inline-block;
    }
    .status-new { background: #e8e0d0; color: #7a6a55; }
    .status-practicing { background: #ffe8c0; color: #8a5a20; }
    .status-solid { background: #d4f0c8; color: #2d6a3e; }
    .status-shining { background: linear-gradient(90deg,#ffe066,#ffd700); color: #5a4000; font-weight: 700; }

    /* Buttons */
    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin: 16px 0;
    }
    .btn {
      background: linear-gradient(180deg, #f5d78e, #e8b86d);
      border: none;
      border-radius: 14px;
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: 700;
      color: #3d2b1f;
      box-shadow: 0 4px 0 #b8956a;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
      min-width: 140px;
    }
    .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #b8956a; }
    .btn.primary {
      background: linear-gradient(180deg, #7ec8a3, #5aab84);
      box-shadow: 0 4px 0 #3d7a5c;
      color: #fff;
    }
    .btn.secondary {
      background: linear-gradient(180deg, #f0e0c8, #e0d0b0);
      box-shadow: 0 4px 0 #b0a080;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Card / Learn screen */
    .card {
      background: var(--soft);
      border: 3px solid var(--wood);
      border-radius: 20px;
      padding: 18px 14px;
      max-width: 420px;
      margin: 0 auto;
      box-shadow: 0 6px 0 var(--wood-dark);
      text-align: center;
    }
    .big-num {
      font-size: 3.2rem;
      font-weight: 900;
      color: var(--wood-dark);
      line-height: 1;
      margin-bottom: 4px;
    }
    .big-name {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .mnemonic-box {
      background: #fff;
      border-radius: 14px;
      padding: 12px;
      margin: 12px 0;
      border: 2px dashed #e8b86d;
    }
    .mnemonic-box .emoji { font-size: 2.8rem; margin-bottom: 6px; }
    .mnemonic-box p { font-size: 0.95rem; line-height: 1.35; }
    .hint {
      font-size: 0.8rem;
      color: #8b7355;
      margin-top: 8px;
    }

    /* Practice options */
    .options {
      display: grid;
      gap: 10px;
      margin-top: 16px;
    }
    .opt {
      background: #fff;
      border: 2px solid var(--wood);
      border-radius: 12px;
      padding: 14px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
    }
    .opt:active { background: #fff8e0; }
    .opt.correct {
      background: #d4f0c8;
      border-color: #5aab84;
    }
    .opt.wrong {
      background: #fde8e0;
      border-color: #e8a07c;
      opacity: 0.7;
    }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #3d2b1f;
      color: #fff;
      padding: 12px 20px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.95rem;
      opacity: 0;
      transition: all 0.3s;
      z-index: 100;
      pointer-events: none;
      max-width: 90%;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    #toast.success { background: #2d6a3e; }
    #toast.warm { background: #8a5a20; }

    /* Bottom nav */
    nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--soft);
      border-top: 3px solid var(--wood);
      display: flex;
      justify-content: space-around;
      padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
      z-index: 50;
    }
    nav button {
      background: none;
      border: none;
      font-size: 0.75rem;
      color: #8b7355;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 6px 10px;
      cursor: pointer;
      border-radius: 12px;
    }
    nav button.active {
      color: var(--wood-dark);
      background: #f5e6c8;
      font-weight: 700;
    }
    nav button span.icon { font-size: 1.4rem; }

    /* Celebration */
    .celebrate {
      text-align: center;
      padding: 20px;
    }
    .celebrate .stars { font-size: 2.5rem; margin: 10px 0; }

    /* Parent / reset */
    .parent-link {
      text-align: center;
      margin-top: 20px;
      font-size: 0.75rem;
      color: #a09080;
    }
    .parent-link a { color: #8b7355; }

    /* Responsive */
    @media (min-width: 500px) {
      .hall { justify-content: flex-start; padding-left: 20px; }
      .portrait { flex: 0 0 140px; }
    }
  </style>
</head>
<body>
  <div id="toast"></div>

  <!-- HOME / HALL -->
  <div id="screen-home" class="screen active">
    <header>
      <h1>Hall of Presidents</h1>
      <div class="subtitle">Memory Palace • Learn • Shine</div>
    </header>

    <div class="mission" id="mission-text">
      Walk the path and make the portraits shine!
    </div>

    <div class="pips" id="pips"></div>

    <div class="hall" id="hall"></div>

    <div class="btn-row">
      <button class="btn primary" onclick="startLearn()">✨ Walk the Path</button>
      <button class="btn" onclick="startPractice()">🎯 Practice</button>
    </div>

    <div class="parent-link">
      <a href="#" onclick="showParent(); return false;">Parent / Progress</a>
      ·
      <a href="#" onclick="if(confirm('Reset all progress?')){resetProgress(); location.reload();}">Reset</a>
    </div>
  </div>

  <!-- LEARN CARD -->
  <div id="screen-learn" class="screen">
    <header>
      <h1>Place in the Palace</h1>
    </header>
    <div class="card" id="learn-card">
      <!-- filled by JS -->
    </div>
    <div class="btn-row">
      <button class="btn primary" id="btn-got-it" onclick="gotIt()">Got it! ✨</button>
      <button class="btn secondary" onclick="showHome()">Back</button>
    </div>
  </div>

  <!-- PRACTICE -->
  <div id="screen-practice" class="screen">
    <header>
      <h1 id="practice-title">Who is next?</h1>
    </header>
    <div class="card" id="practice-card">
      <!-- filled by JS -->
    </div>
    <div class="btn-row">
      <button class="btn secondary" onclick="showHome()">Home</button>
    </div>
  </div>

  <!-- PARENT / STATS -->
  <div id="screen-parent" class="screen">
    <header>
      <h1>Grown-up View</h1>
      <div class="subtitle">Progress is soft for kids — numbers here only</div>
    </header>
    <div class="card" style="text-align:left; font-size:0.9rem;">
      <p id="stats-text"></p>
      <div class="btn-row" style="margin-top:16px;">
        <button class="btn" onclick="showHome()">Back to Hall</button>
      </div>
    </div>
  </div>

  <!-- Bottom Nav -->
  <nav>
    <button class="active" onclick="showHome()" id="nav-home">
      <span class="icon">🏛️</span>Hall
    </button>
    <button onclick="startLearn()" id="nav-learn">
      <span class="icon">✨</span>Learn
    </button>
    <button onclick="startPractice()" id="nav-practice">
      <span class="icon">🎯</span>Practice
    </button>
  </nav>

  <script>
    // ========== DATA ==========
    const PRESIDENTS = [
      { n:1,  name:"George Washington",     short:"Washington",   mnemonic:"Washing a giant TON of laundry! Splash!", emoji:"🧺" },
      { n:2,  name:"John Adams",             short:"Adams",        mnemonic:"Adding big numbers on a chalkboard that keeps growing.", emoji:"➕" },
      { n:3,  name:"Thomas Jefferson",       short:"Jefferson",    mnemonic:"A chef’s son (Jeff-er-son) cooking atoms in a frying pan.", emoji:"👨‍🍳" },
      { n:4,  name:"James Madison",          short:"Madison",      mnemonic:"A MAD sun yelling under a grill!", emoji:"☀️" },
      { n:5,  name:"James Monroe",           short:"Monroe",       mnemonic:"A man ROWing a boat with a big number 5.", emoji:"🚣" },
      { n:6,  name:"John Quincy Adams",      short:"Q. Adams",     mnemonic:"A cue ball bouncing into a dam (Q + Adams).", emoji:"🎱" },
      { n:7,  name:"Andrew Jackson",         short:"Jackson",      mnemonic:"A jack-in-the-box popping out of a Jack-o-lantern!", emoji:"🎃" },
      { n:8,  name:"Martin Van Buren",       short:"Van Buren",    mnemonic:"A VAN that is BURNing (burrrr!) in the freezer.", emoji:"🚐" },
      { n:9,  name:"William Henry Harrison", short:"W.H. Harrison",mnemonic:"A hairy monkey with lots of HAIR!", emoji:"🐒" },
      { n:10, name:"John Tyler",             short:"Tyler",        mnemonic:"Tying TEN knots in a long rope.", emoji:"🪢" },
      { n:11, name:"James K. Polk",          short:"Polk",         mnemonic:"Poking holes in the yard with two sticks (looks like 11).", emoji:"🥢" },
      { n:12, name:"Zachary Taylor",         short:"Taylor",       mnemonic:"A tailor sewing twelve shiny buttons.", emoji:"🧵" },
      { n:13, name:"Millard Fillmore",       short:"Fillmore",     mnemonic:"Filling MORE and more glasses of water (13 cups!).", emoji:"🥛" },
      { n:14, name:"Franklin Pierce",        short:"Pierce",       mnemonic:"A spear PIERCING through the number 14.", emoji:"🗡️" },
      { n:15, name:"James Buchanan",         short:"Buchanan",     mnemonic:"Firing fifteen cannons that say BOO!", emoji:"💣" },
      { n:16, name:"Abraham Lincoln",        short:"Lincoln",      mnemonic:"Lincoln in a tall top hat giving a speech with 16 stars.", emoji:"🎩" },
      { n:17, name:"Andrew Johnson",         short:"A. Johnson",   mnemonic:"A giant sewing needle (Johnson) stitching a bed.", emoji:"🪡" },
      { n:18, name:"Ulysses S. Grant",       short:"Grant",        mnemonic:"A friendly genie GRANTing wishes.", emoji:"🧞" },
      { n:19, name:"Rutherford B. Hayes",    short:"Hayes",        mnemonic:"Saying HEY! while giving a high-five in a hay field.", emoji:"🙌" },
      { n:20, name:"James A. Garfield",      short:"Garfield",     mnemonic:"Garfield the cat eating twenty lasagnas!", emoji:"🐱" },
      { n:21, name:"Chester A. Arthur",      short:"Arthur",       mnemonic:"King Arthur writing a book as an AUTHOR.", emoji:"👑" },
      { n:22, name:"Grover Cleveland",       short:"Cleveland",    mnemonic:"A giant CLEAVER cutting corn.", emoji:"🌽" },
      { n:23, name:"Benjamin Harrison",      short:"B. Harrison",  mnemonic:"Another hairy monkey (Harrison) swinging!", emoji:"🦧" },
      { n:24, name:"Grover Cleveland",       short:"Cleveland 2",  mnemonic:"The same cleaver comes back for round two!", emoji:"🌽" },
      { n:25, name:"William McKinley",       short:"McKinley",     mnemonic:"Ronald McDonald with a crown giving 25 burgers.", emoji:"🍔" },
      { n:26, name:"Theodore Roosevelt",     short:"T. Roosevelt", mnemonic:"Teddy on a horse wearing a belt of ROSES.", emoji:"🌹" },
      { n:27, name:"William Howard Taft",    short:"Taft",         mnemonic:"Stuck in sticky TAFFY!", emoji:"🍬" },
      { n:28, name:"Woodrow Wilson",         short:"Wilson",       mnemonic:"A will (document) coming out of a coffin like a zombie.", emoji:"📜" },
      { n:29, name:"Warren G. Harding",      short:"Harding",      mnemonic:"A giant metal HARD man standing in the street.", emoji:"🤖" },
      { n:30, name:"Calvin Coolidge",        short:"Coolidge",     mnemonic:"Standing in a big COOLER keeping cool.", emoji:"🧊" },
      { n:31, name:"Herbert Hoover",         short:"Hoover",       mnemonic:"A vacuum cleaner HOOVERing up everything.", emoji:"🧹" },
      { n:32, name:"Franklin D. Roosevelt",  short:"FDR",          mnemonic:"A giant ROOSTER with four roses (32).", emoji:"🐓" },
      { n:33, name:"Harry S. Truman",        short:"Truman",       mnemonic:"A TRUE man telling the truth with a big star.", emoji:"⭐" },
      { n:34, name:"Dwight D. Eisenhower",   short:"Eisenhower",   mnemonic:"An EYEball watching everything carefully.", emoji:"👁️" },
      { n:35, name:"John F. Kennedy",        short:"Kennedy",      mnemonic:"A Ken doll with a candy bar.", emoji:"🍬" },
      { n:36, name:"Lyndon B. Johnson",      short:"L.B. Johnson", mnemonic:"John’s son (Johnson) with a big LBJ hat.", emoji:"🧢" },
      { n:37, name:"Richard Nixon",          short:"Nixon",        mnemonic:"Mixing a big bowl of NIX-on soup.", emoji:"🥣" },
      { n:38, name:"Gerald Ford",            short:"Ford",         mnemonic:"Driving a shiny FORD car across a river.", emoji:"🚗" },
      { n:39, name:"Jimmy Carter",           short:"Carter",       mnemonic:"A CART full of peanuts rolling by.", emoji:"🥜" },
      { n:40, name:"Ronald Reagan",          short:"Reagan",       mnemonic:"A ray-gun (Reagan) shooting stars.", emoji:"🔫" },
      { n:41, name:"George H. W. Bush",      short:"H.W. Bush",    mnemonic:"A bush with a big H.W. monogram.", emoji:"🌳" },
      { n:42, name:"Bill Clinton",           short:"Clinton",      mnemonic:"A giant bill (dollar) climbing a mountain.", emoji:"💵" },
      { n:43, name:"George W. Bush",         short:"W. Bush",      mnemonic:"Another bush, this one with a big W.", emoji:"🌲" },
      { n:44, name:"Barack Obama",           short:"Obama",        mnemonic:"A bar of soap (Barack) with an “O” shining.", emoji:"🧼" },
      { n:45, name:"Donald Trump",           short:"Trump (1st)",  mnemonic:"A golden trumpet blasting a fanfare.", emoji:"🎺" },
      { n:46, name:"Joe Biden",              short:"Biden",        mnemonic:"A bicycle (Bi-den) with a big 46 flag.", emoji:"🚲" },
      { n:47, name:"Donald Trump",           short:"Trump (2nd)",  mnemonic:"The golden trumpet returns for an encore!", emoji:"🎺" }
    ];

    // State: { state: 0-3, consec: number, introduced: bool }
    let progress = {};
    let currentLearnIndex = 0;
    let currentPractice = null;
    let consecutiveSession = 0;

    // ========== PERSISTENCE ==========
    function loadProgress() {
      try {
        const raw = localStorage.getItem("presidents-palace-v1");
        if (raw) progress = JSON.parse(raw);
      } catch(e) {}
      // ensure every president has an entry
      PRESIDENTS.forEach(p => {
        if (!progress[p.n]) {
          progress[p.n] = { state: 0, consec: 0, introduced: false };
        }
      });
    }
    function saveProgress() {
      localStorage.setItem("presidents-palace-v1", JSON.stringify(progress));
    }
    function resetProgress() {
      localStorage.removeItem("presidents-palace-v1");
      progress = {};
      loadProgress();
    }

    // ========== HELPERS ==========
    function getSolidCount() {
      return Object.values(progress).filter(s => s.state >= 2).length;
    }
    function getShiningCount() {
      return Object.values(progress).filter(s => s.state >= 3).length;
    }
    function getIntroducedCount() {
      return Object.values(progress).filter(s => s.introduced).length;
    }
    function nextToIntroduce() {
      for (let p of PRESIDENTS) {
        if (!progress[p.n].introduced) return p;
      }
      return null;
    }
    function getCooking() {
      // up to 3 items that are introduced but not yet solid
      return PRESIDENTS.filter(p => progress[p.n].introduced && progress[p.n].state < 2).slice(0, 3);
    }
    function stateLabel(s) {
      return ["new", "practicing", "getting solid", "shining"][s] || "new";
    }
    function stateClass(s) {
      return ["new", "practicing", "solid", "shining"][s] || "new";
    }

    // ========== UI RENDER ==========
    function renderHall() {
      const hall = document.getElementById("hall");
      hall.innerHTML = "";
      PRESIDENTS.forEach(p => {
        const st = progress[p.n];
        const div = document.createElement("div");
        div.className = `portrait state-${st.state}`;
        div.innerHTML = `
          <div class="num">#${p.n}</div>
          <div class="name">${p.short}</div>
          <div class="status status-${stateClass(st.state)}">${stateLabel(st.state)}</div>
        `;
        div.onclick = () => {
          if (st.introduced || st.state > 0) {
            showLearnCard(p, true);
          } else {
            toast("This portrait is still waiting to be placed!", "warm");
          }
        };
        hall.appendChild(div);
      });
    }

    function renderPips() {
      const solid = getSolidCount();
      const target = 10; // unlock Parade at ~10 solid
      const pips = document.getElementById("pips");
      pips.innerHTML = "";
      for (let i = 0; i < target; i++) {
        const pip = document.createElement("div");
        pip.className = "pip" + (i < solid ? " filled" : "");
        pips.appendChild(pip);
      }
    }

    function updateMission() {
      const solid = getSolidCount();
      const next = nextToIntroduce();
      const cooking = getCooking();
      let text = "";
      if (solid >= 10) {
        text = `🎉 <strong>${solid} presidents getting solid!</strong> Parade mode is open. Keep shining!`;
      } else if (cooking.length > 0) {
        text = `Keep practicing <strong>${cooking.map(p => "#"+p.n+" "+p.short).join(", ")}</strong> until they get solid.`;
      } else if (next) {
        text = `Ready for the next one? Let’s place <strong>#${next.n} ${next.short}</strong> in the palace!`;
      } else {
        text = `All portraits are shining! You are a true Memory Builder. 🌟`;
      }
      document.getElementById("mission-text").innerHTML = text;
    }

    function toast(msg, type = "") {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.className = "show " + type;
      setTimeout(() => t.className = "", 2600);
    }

    // ========== SCREENS ==========
    function showScreen(id) {
      document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
      document.getElementById(id).classList.add("active");
      // nav highlight
      document.querySelectorAll("nav button").forEach(b => b.classList.remove("active"));
      if (id === "screen-home") document.getElementById("nav-home").classList.add("active");
      if (id === "screen-learn") document.getElementById("nav-learn").classList.add("active");
      if (id === "screen-practice") document.getElementById("nav-practice").classList.add("active");
    }

    function showHome() {
      renderHall();
      renderPips();
      updateMission();
      showScreen("screen-home");
    }

    function showParent() {
      const solid = getSolidCount();
      const shining = getShiningCount();
      const intro = getIntroducedCount();
      document.getElementById("stats-text").innerHTML = `
        <strong>Mastery overview</strong><br><br>
        Introduced: ${intro} / 47<br>
        Getting solid (≥2): ${solid}<br>
        Shining (mastered): ${shining}<br><br>
        <em>Kids never see these numbers. Their view is only soft pips and glowing portraits.</em>
      `;
      showScreen("screen-parent");
    }

    // ========== LEARN ==========
    function startLearn() {
      // Prefer cooking items, otherwise introduce next
      let target = null;
      const cooking = getCooking();
      if (cooking.length > 0) {
        // pick the one with lowest state or lowest consec
        target = cooking.sort((a,b) => progress[a.n].state - progress[b.n].state || progress[a.n].consec - progress[b.n].consec)[0];
      } else {
        target = nextToIntroduce();
      }
      if (!target) {
        toast("Everything is already shining! 🌟", "success");
        return;
      }
      showLearnCard(target);
    }

    function showLearnCard(p, review = false) {
      progress[p.n].introduced = true;
      saveProgress();

      const card = document.getElementById("learn-card");
      card.innerHTML = `
        <div class="big-num">#${p.n}</div>
        <div class="big-name">${p.name}</div>
        <div class="mnemonic-box">
          <div class="emoji">${p.emoji}</div>
          <p><strong>Memory picture:</strong><br>${p.mnemonic}</p>
        </div>
        <p class="hint">Say the number and name out loud while you picture it. Make it silly and moving!</p>
      `;
      document.getElementById("btn-got-it").onclick = () => gotIt(p);
      showScreen("screen-learn");
    }

    function gotIt(p) {
      // gentle advancement on first look
      const st = progress[p.n];
      if (st.state === 0) {
        st.state = 1; // practicing
        st.consec = 0;
      }
      saveProgress();
      toast(`#${p.n} ${p.short} is practicing!`, "success");
      setTimeout(() => {
        // after a short moment, offer practice or go home
        if (Math.random() > 0.4) {
          startPracticeFor(p);
        } else {
          showHome();
        }
      }, 900);
    }

    // ========== PRACTICE ==========
    function startPractice() {
      // build a pool of introduced presidents
      const pool = PRESIDENTS.filter(p => progress[p.n].introduced);
      if (pool.length < 2) {
        toast("Place a few more presidents first!", "warm");
        startLearn();
        return;
      }
      // prefer cooking ones
      const cooking = getCooking();
      let target;
      if (cooking.length > 0 && Math.random() > 0.3) {
        target = cooking[Math.floor(Math.random() * cooking.length)];
      } else {
        target = pool[Math.floor(Math.random() * pool.length)];
      }
      startPracticeFor(target);
    }

    function startPracticeFor(p) {
      currentPractice = p;
      // Prefer number questions early; "who comes after" only when previous is known
      let mode = Math.random() > 0.4 ? "number" : "next";
      const prev = PRESIDENTS.find(x => x.n === p.n - 1);
      if (mode === "next" && (!prev || !progress[prev.n].introduced)) {
        mode = "number";
      }
      const card = document.getElementById("practice-card");
      document.getElementById("practice-title").textContent = mode === "number" ? "Who is this number?" : "Who comes next?";

      let questionHtml = "";
      let options = [];

      if (mode === "number") {
        questionHtml = `<div class="big-num">#${p.n}</div><p style="margin:8px 0 12px">Which president is number ${p.n}?</p>`;
        options = generateOptions(p, "name");
      } else {
        questionHtml = `<p style="font-size:1.1rem; margin-bottom:12px">Who comes <strong>after</strong><br><strong>${prev.short}</strong>?</p>`;
        options = generateOptions(p, "name");
      }

      card.innerHTML = questionHtml + `<div class="options" id="opts"></div>`;
      const optsDiv = document.getElementById("opts");
      options.forEach(opt => {
        const btn = document.createElement("div");
        btn.className = "opt";
        btn.textContent = opt.label;
        btn.onclick = () => checkAnswer(opt.correct, btn, p);
        optsDiv.appendChild(btn);
      });
      showScreen("screen-practice");
    }

    function generateOptions(correctP, type) {
      const opts = [{ label: correctP.name, correct: true }];
      const others = PRESIDENTS.filter(x => x.n !== correctP.n && progress[x.n].introduced);
      // shuffle and take 3
      const shuffled = others.sort(() => Math.random() - 0.5).slice(0, 3);
      shuffled.forEach(o => opts.push({ label: o.name, correct: false }));
      // if not enough, fill with later ones
      while (opts.length < 4) {
        const filler = PRESIDENTS[Math.floor(Math.random() * PRESIDENTS.length)];
        if (!opts.find(o => o.label === filler.name)) {
          opts.push({ label: filler.name, correct: false });
        }
      }
      return opts.sort(() => Math.random() - 0.5);
    }

    function checkAnswer(isCorrect, btn, p) {
      // disable all
      document.querySelectorAll(".opt").forEach(o => o.style.pointerEvents = "none");
      if (isCorrect) {
        btn.classList.add("correct");
        recordCorrect(p);
      } else {
        btn.classList.add("wrong");
        // highlight the correct one
        document.querySelectorAll(".opt").forEach(o => {
          if (o.textContent === p.name) o.classList.add("correct");
        });
        recordMiss(p);
      }
    }

    function recordCorrect(p) {
      const st = progress[p.n];
      st.consec = (st.consec || 0) + 1;
      if (st.state === 0) st.state = 1;
      if (st.state === 1 && st.consec >= 2) {
        st.state = 2; // solid
        toast(`✨ #${p.n} ${p.short} is getting solid!`, "success");
      } else if (st.state === 2 && st.consec >= 3) {
        st.state = 3; // shining
        toast(`🌟 #${p.n} ${p.short} is SHINING!`, "success");
      } else {
        toast(`Yes! #${p.n} ${p.short}`, "success");
      }
      saveProgress();
      setTimeout(() => {
        // continue or home
        if (getCooking().length > 0 || nextToIntroduce()) {
          startPractice();
        } else {
          showHome();
        }
      }, 1400);
    }

    function recordMiss(p) {
      const st = progress[p.n];
      st.consec = 0;
      // never demote hard
      toast(`Almost… picture the memory image for #${p.n}`, "warm");
      saveProgress();
      setTimeout(() => {
        // gentle reveal then continue
        startPractice();
      }, 1800);
    }

    // ========== INIT ==========
    loadProgress();
    // introduce first 3 automatically for a gentle start
    for (let i = 0; i < 3; i++) {
      if (PRESIDENTS[i]) progress[PRESIDENTS[i].n].introduced = true;
    }
    saveProgress();
    showHome();
  </script>
</body>
</html>
